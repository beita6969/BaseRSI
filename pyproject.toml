[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "basersi"
version = "0.1.0"
description = "BaseRSI"
requires-python = ">=3.12,<3.13"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml==6.0.3",
    "numpy==2.0.2",
    "scipy==1.13.1",
    "pillow==13.0.0",
    "aiohttp==3.14.5",
]

[project.optional-dependencies]
gpu = [
    "torch==2.14.0",
    "transformers==5.20.2",
    "vllm==0.33.0",
    "safetensors==0.8.0",
]
sources = [
    "pandas==2.3.3",
    "pyarrow==22.0.0",
]

[project.scripts]
basersi = "basersi.cli.__main__:main"

[tool.setuptools.packages.find]
include = ["basersi*"]

[tool.setuptools.package-data]
"basersi.config" = ["*.yaml", "*.jsonl"]
